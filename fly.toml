app = "sports-tracker-iiith"
primary_region = "bom"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "suspend"
  # the volume is single-machine, so never run more than one
  min_machines_running = 1

[[mounts]]
  source = "pb_data"
  destination = "/pb_data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
